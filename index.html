<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Per te</title>
<style>
  :root { --bg:#faf7f2; --ink:#2b2622; --muted:#7a6f66; --accent:#b5651d; --card:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1d1a17; --ink:#eee8df; --muted:#a79c90; --accent:#e0a064; --card:#27221e; }
  }
  :root[data-theme="dark"] { --bg:#1d1a17; --ink:#eee8df; --muted:#a79c90; --accent:#e0a064; --card:#27221e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, "Times New Roman", serif; line-height:1.6; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-weight: normal; font-size: 1.6rem; text-align: center; margin: 0 0 8px; }
  .sub { text-align:center; color:var(--muted); margin:0 0 32px; font-style: italic; }
  form { display:flex; flex-direction:column; gap:12px; max-width: 360px; margin: 0 auto; }
  input[type=password] { font: inherit; font-size: 1rem; padding: 12px; border:1px solid var(--muted); border-radius: 8px; background: var(--card); color: var(--ink); }
  button { font: inherit; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  .error { color: var(--accent); text-align:center; min-height: 1.5em; margin-top: 16px; }
  #content { display:none; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  .card p { margin: 0 0 1em; white-space: pre-line; }
  .card p:last-child { margin-bottom: 0; }
  .photos { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
  .photos img { width: 100%; height: auto; border-radius: 8px; display:block; }
  .song { margin-top: 24px; }
  .song iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
  .song a { color: var(--accent); }
  @media (max-width: 480px) { main { padding: 32px 16px; } }
</style>
</head>
<body>
<main>
  <div id="gate">
    <h1>Per te</h1>
    <p class="sub">Inserisci la tua password per leggere il tuo messaggio.</p>
    <form id="form">
      <input type="password" id="pw" autocomplete="off" placeholder="Password" required>
      <button type="submit">Apri</button>
    </form>
    <div class="error" id="error"></div>
  </div>
  <div id="content"></div>
</main>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(password) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(DATA.salt), iterations: DATA.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
}

async function tryOpen(key) {
  for (const entry of DATA.entries) {
    const bytes = b64ToBytes(entry);
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch (e) { /* not this entry */ }
  }
  return null;
}

let CURRENT_KEY = null;
async function loadPhotos(name) {
  const res = await fetch("p/" + name);
  if (!res.ok) throw new Error("photo");
  const all = new Uint8Array(await res.arrayBuffer());
  const view = new DataView(all.buffer);
  const urls = [];
  let off = 0;
  while (off + 4 <= all.length) {
    const len = view.getUint32(off); off += 4;
    const blob = all.slice(off, off + len); off += len;
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, CURRENT_KEY, blob.slice(12));
    urls.push(URL.createObjectURL(new Blob([plain], { type: "image/jpeg" })));
  }
  return urls;
}

function youtubeId(url) {
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function render(payload) {
  const content = document.getElementById("content");
  content.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";
  for (const para of payload.text.split(/\n\s*\n/)) {
    const p = document.createElement("p");
    p.textContent = para.trim();
    card.appendChild(p);
  }
  if (payload.photos) {
    const grid = document.createElement("div");
    grid.className = "photos";
    card.appendChild(grid);
    loadPhotos(payload.photos).then((urls) => {
      for (const u of urls) {
        const img = document.createElement("img");
        img.alt = "";
        img.src = u;
        grid.appendChild(img);
      }
    }).catch(() => { grid.remove(); });
  }
  content.appendChild(card);

  if (payload.song && payload.song.url) {
    const box = document.createElement("div");
    box.className = "card song";
    const id = youtubeId(payload.song.url);
    if (id) {
      const frame = document.createElement("iframe");
      frame.src = "https://www.youtube-nocookie.com/embed/" + id;
      frame.allow = "accelerometer; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;
      frame.title = payload.song.title || "Canzone";
      box.appendChild(frame);
    }
    const link = document.createElement("p");
    const a = document.createElement("a");
    a.href = payload.song.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = payload.song.title ? payload.song.title : "Ascolta la canzone";
    link.appendChild(a);
    box.appendChild(link);
    content.appendChild(box);
  }

  document.getElementById("gate").style.display = "none";
  content.style.display = "block";
}

document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const error = document.getElementById("error");
  error.textContent = "Un momento...";
  try {
    const key = await deriveKey(document.getElementById("pw").value);
    const payload = await tryOpen(key);
    if (payload) {
      error.textContent = "";
      CURRENT_KEY = key;
      render(payload);
    } else {
      error.textContent = "Password non valida. Controlla e riprova.";
    }
  } catch (e) {
    error.textContent = "Qualcosa non ha funzionato. Riprova.";
  }
});
